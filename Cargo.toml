[workspace]
resolver = "3"

[package]
name = "threatflux-package-security"
version = "0.2.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["ThreatFlux Team"]
description = "Bounded offline-first metadata and risk signals for npm, Python, and Java packages"
license = "MIT"
repository = "https://github.com/ThreatFlux/threatflux-package-security"
homepage = "https://github.com/ThreatFlux/threatflux-package-security"
documentation = "https://docs.rs/threatflux-package-security"
readme = "README.md"
keywords = ["security", "supply-chain", "dependencies", "vulnerability", "packages"]
categories = ["development-tools", "security"]
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/docs/**",
    "/CHANGELOG.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/DEVELOPMENT.md",
    "/README.md",
    "/SECURITY.md",
    "/TESTING.md",
    "/Cargo.lock",
    "/LICENSE",
]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", default-features = false, features = ["fs", "io-util", "rt"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
regex = "1.11"
pep440_rs = { version = "0.7.3", default-features = false }
strsim = "0.11"
async-trait = "0.1"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
toml = "1.0"

[dev-dependencies]
tempfile = "3.15"
tokio = { version = "1.40", default-features = false, features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
