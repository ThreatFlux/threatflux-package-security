name: Auto Release

concurrency:
  # A dry-run dispatch must never cancel a real release in progress.
  group: auto-release-${{ github.event.workflow_run.head_branch || github.ref_name || 'main' }}${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: [CI, Security]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Analyze and report the next release without committing, tagging, releasing, or dispatching release.yml
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  release:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ThreatFlux/github_actions/.github/workflows/reusable-auto-release.yml@eb9f3cf78c3899be0c4c9323d5cc86de5e1fdee8 # v0.7.7
    with:
      bump: ${{ github.event.inputs.version_bump || 'auto' }}
      # Only a manual dispatch can request a dry run; workflow_run always releases.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      required-workflows: CI,Security
      # The ThreatFlux automation App pushes the release tag, which starts
      # release.yml through its `push: tags` trigger, so the reusable workflow
      # dispatches nothing on that path (dispatch-on-app-token stays false).
      # release.yml is dispatched on the new tag only if the release falls
      # back to GITHUB_TOKEN, whose tag push starts no workflow. No
      # dispatch-version-workflow: release.yml accepts `version` only for dry
      # runs.
      dispatch-workflows: release.yml
      github-app-id: ${{ vars.TF_AUTOMATION_APP_ID }}
    secrets:
      github-app-private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
