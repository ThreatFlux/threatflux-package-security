name: Auto Release

concurrency:
  # A dry-run dispatch must never cancel a real release in progress.
  group: auto-release-${{ github.event.workflow_run.head_branch || github.ref_name || 'main' }}${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: [CI, Security]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Analyze and report the next release without committing, tagging, releasing, or dispatching release.yml
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  release:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ThreatFlux/github_actions/.github/workflows/reusable-auto-release.yml@8633e03be96acd076b36bfdf7bec2345e6614c5c # v0.7.6
    with:
      bump: ${{ github.event.inputs.version_bump || 'auto' }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      required-workflows: CI,Security
      dispatch-workflows: release.yml

    # secrets:
    #   release-token: ${{ secrets.RELEASE_TOKEN }}
