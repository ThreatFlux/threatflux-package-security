name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # A real dispatch (auto-release passes no inputs) must run on the release
  # tag. A dry run builds the dispatch ref (gh workflow run --ref <branch>) and
  # nothing is tagged, released, or published.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Rehearse the release (gates, package, publish --dry-run) without tagging, releasing, or publishing
        required: false
        type: boolean
        default: false
      version:
        description: "Dry run only: version to rehearse, e.g. 0.2.2 (defaults to the Cargo.toml version)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Dry runs must never queue behind, or hold up, a real release.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'release-dry-run' || 'release' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Only workflow_dispatch can set this; tag pushes always perform a real release.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

jobs:
  provenance:
    name: Verify release provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      package_name: ${{ steps.version.outputs.package_name }}
      package_version: ${{ steps.version.outputs.package_version }}
      published: ${{ steps.registry.outputs.published }}
      published_checksum: ${{ steps.registry.outputs.published_checksum }}
      tag_object: ${{ steps.provenance.outputs.tag_object }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Verify semantic version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          package_name="$(jq -er '.packages[] | select(.name == "threatflux-package-security") | .name' <<< "$metadata")"
          manifest_version="$(jq -er '.packages[] | select(.name == "threatflux-package-security") | .version' <<< "$metadata")"

          if [[ "$DRY_RUN" == "true" ]]; then
            # Auto-release bumps the manifest in the release commit it tags; the
            # publish job stages that same bump locally for the requested version.
            release_tag="v${REQUESTED_VERSION:-$manifest_version}"
            echo "Dry run: rehearsing ${release_tag} from ${GITHUB_REF_NAME}@${GITHUB_SHA} without creating or checking the tag"
          else
            if [[ -n "$REQUESTED_VERSION" ]]; then
              echo "The version input only applies to dry runs; dispatch a real release on its tag" >&2
              exit 1
            fi
            release_tag="$GITHUB_REF_NAME"
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag $release_tag is not a semantic version" >&2
            exit 1
          fi
          if [[ "$DRY_RUN" != "true" && "$release_tag" != "v${manifest_version}" ]]; then
            echo "Tag $release_tag does not match ${package_name} ${manifest_version}" >&2
            exit 1
          fi

          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "package_version=${release_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify annotated tag is on main
        if: env.DRY_RUN != 'true'
        id: provenance
        shell: bash
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} must be annotated" >&2
            exit 1
          fi

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          tag_commit="$(git rev-list -n 1 "$tag_ref")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release commit $tag_commit is not reachable from origin/main" >&2
            exit 1
          fi

          tag_object="$(git rev-parse "$tag_ref")"
          remote_tag_object="$(git ls-remote --tags origin "$tag_ref" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$remote_tag_object" || "$remote_tag_object" != "$tag_object" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} changed during provenance verification" >&2
            exit 1
          fi
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"

      - name: Inspect crates.io publication state
        id: registry
        env:
          PACKAGE_NAME: ${{ steps.version.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        shell: bash
        run: |
          response="$(mktemp)"
          status="$(curl --silent --show-error --retry 3 \
            --user-agent "ThreatFlux-package-security-release/${GITHUB_RUN_ID}" \
            --output "$response" --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/${PACKAGE_NAME}")"

          if [[ "$status" == "404" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "published_checksum=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$status" != "200" ]]; then
            echo "crates.io returned HTTP $status for ${PACKAGE_NAME}" >&2
            cat "$response" >&2
            exit 1
          fi
          if ! jq -e '.versions | type == "array"' "$response" >/dev/null; then
            echo "crates.io returned an unexpected response for ${PACKAGE_NAME}" >&2
            exit 1
          fi

          checksum="$(jq -er --arg version "$PACKAGE_VERSION" \
            '.versions[] | select(.num == $version) | .checksum' "$response" 2>/dev/null || true)"
          if [[ -n "$checksum" ]]; then
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "${PACKAGE_NAME} ${PACKAGE_VERSION} is already on crates.io; rehearse an unpublished version" >&2
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "published_checksum=$checksum" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "published_checksum=" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify release (${{ matrix.os }})
    needs: provenance
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Test release build
        run: cargo test --release --all-targets --all-features --locked

  publish:
    name: Package and publish to crates.io
    needs: [provenance, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Dry runs skip the tag-only crates-io environment: an empty name runs the
    # job without an environment, so no deployment is recorded. The crates.io
    # trusted publisher is bound to that environment, so a dry run's OIDC
    # identity cannot be exchanged for a registry token.
    environment:
      name: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'crates-io' || '' }}
      url: https://crates.io/crates/threatflux-package-security
    permissions:
      contents: read
      id-token: write # Required to exchange GitHub's OIDC identity for a crates.io token.
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt

      - name: Stage the release version (dry run)
        if: env.DRY_RUN == 'true'
        env:
          PACKAGE_NAME: ${{ needs.provenance.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.provenance.outputs.package_version }}
        shell: bash
        run: |
          manifest_version() {
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er --arg name "$PACKAGE_NAME" '.packages[] | select(.name == $name) | .version'
          }
          if [[ "$(manifest_version)" == "$PACKAGE_VERSION" ]]; then
            echo "${PACKAGE_NAME} is already at ${PACKAGE_VERSION}"
            exit 0
          fi

          # Mirror the release commit auto-release tags: bump the [package]
          # version and its lockfile entry, nothing else.
          awk -v version="$PACKAGE_VERSION" '
            /^\[/ { in_package = ($0 == "[package]") }
            in_package && !done && /^version = "/ { print "version = \"" version "\""; done = 1; next }
            { print }
          ' Cargo.toml > "${RUNNER_TEMP}/Cargo.toml"
          mv "${RUNNER_TEMP}/Cargo.toml" Cargo.toml
          cargo update --workspace

          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          if [[ "$changed" != "Cargo.lock Cargo.toml " ]]; then
            echo "Version staging changed unexpected files: ${changed}" >&2
            exit 1
          fi
          if [[ "$(manifest_version)" != "$PACKAGE_VERSION" ]]; then
            echo "Could not stage ${PACKAGE_NAME} ${PACKAGE_VERSION}" >&2
            exit 1
          fi

          # Local-only commit (credentials are not persisted) so packaging sees
          # a clean tree, exactly as it does on the tagged release commit.
          git -c user.name="ThreatFlux release dry run" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --all --message "chore: release v${PACKAGE_VERSION} (dry run)"
          git show --stat --format='%h %s' HEAD

      - name: Check formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build and test API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --all-features --no-deps --locked
          cargo test --doc --all-features --locked
          make markdown

      - name: Install supply-chain tools
        # This pinned installer commit also pins tool versions and checksums.
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-audit,cargo-deny

      - name: Verify advisories and dependency policy
        run: |
          cargo audit --deny warnings
          cargo deny check

      - name: Validate crates.io publication
        env:
          PACKAGE_NAME: ${{ needs.provenance.outputs.package_name }}
        run: cargo publish --dry-run --locked --package "$PACKAGE_NAME"

      - name: Build release package
        env:
          PACKAGE_NAME: ${{ needs.provenance.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.provenance.outputs.package_version }}
        shell: bash
        run: |
          mkdir -p target
          cargo package --list --locked --package "$PACKAGE_NAME" \
            > target/package-contents.txt
          cargo package --locked --package "$PACKAGE_NAME"
          package="target/package/${PACKAGE_NAME}-${PACKAGE_VERSION}.crate"
          test -f "$package"
          local_checksum="$(sha256sum "$package" | awk '{ print $1 }')"
          echo "LOCAL_PACKAGE=$package" >> "$GITHUB_ENV"
          echo "LOCAL_CHECKSUM=$local_checksum" >> "$GITHUB_ENV"

      - name: Verify existing publication matches this tag
        if: needs.provenance.outputs.published == 'true'
        env:
          PUBLISHED_CHECKSUM: ${{ needs.provenance.outputs.published_checksum }}
        shell: bash
        run: |
          if [[ -z "$PUBLISHED_CHECKSUM" || "$LOCAL_CHECKSUM" != "$PUBLISHED_CHECKSUM" ]]; then
            echo "Published crate checksum does not match the tagged source package" >&2
            exit 1
          fi

      - name: Recheck immutable release tag
        if: env.DRY_RUN != 'true'
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.provenance.outputs.tag_object }}
        shell: bash
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          remote_tag_object="$(git ls-remote --tags origin "$tag_ref" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$EXPECTED_TAG_OBJECT" || "$remote_tag_object" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} changed or disappeared after verification" >&2
            exit 1
          fi

      # Trusted publishing is the only credential path: crates.io trusts this
      # repository's release.yml in the crates-io environment, and the action
      # exchanges the job's OIDC identity for a short-lived token it revokes
      # when the job ends. No registry secret is read, so a failed exchange
      # fails the release instead of falling back to a long-lived token.
      - name: Authenticate with crates.io
        if: env.DRY_RUN != 'true' && needs.provenance.outputs.published == 'false'
        id: crates-io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate
        if: env.DRY_RUN != 'true' && needs.provenance.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
          PACKAGE_NAME: ${{ needs.provenance.outputs.package_name }}
        shell: bash
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "crates.io trusted publishing did not return a token" >&2
            exit 1
          fi
          cargo publish --locked --package "$PACKAGE_NAME"

      - name: Download and verify the published crate
        if: env.DRY_RUN != 'true'
        env:
          PACKAGE_NAME: ${{ needs.provenance.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.provenance.outputs.package_version }}
        shell: bash
        run: |
          mkdir release-artifacts
          destination="release-artifacts/${PACKAGE_NAME}-${PACKAGE_VERSION}.crate"

          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location \
              --user-agent "ThreatFlux-package-security-release/${GITHUB_RUN_ID}" \
              "https://crates.io/api/v1/crates/${PACKAGE_NAME}/${PACKAGE_VERSION}/download" \
              --output "$destination"; then
              break
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "Published crate was not downloadable after 12 attempts" >&2
              exit 1
            fi
            sleep 10
          done

          downloaded_checksum="$(sha256sum "$destination" | awk '{ print $1 }')"
          if [[ "$downloaded_checksum" != "$LOCAL_CHECKSUM" ]]; then
            echo "Downloaded crate does not match the package uploaded by Cargo" >&2
            exit 1
          fi

          cp target/package-contents.txt release-artifacts/
          cd release-artifacts
          sha256sum "${PACKAGE_NAME}-${PACKAGE_VERSION}.crate" \
            > "${PACKAGE_NAME}-${PACKAGE_VERSION}.crate.sha256"

      - name: Upload published package
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate-package
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Report dry-run package
        if: env.DRY_RUN == 'true'
        shell: bash
        run: |
          echo "Dry run complete: ${LOCAL_PACKAGE} sha256 ${LOCAL_CHECKSUM}"
          echo "Package files: $(wc -l < target/package-contents.txt)"
          echo "Nothing was tagged, released, published, or uploaded."

  github-release:
    name: Create GitHub release
    needs: [provenance, publish]
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write # Required to persist GitHub artifact attestations.
      contents: write # Required only to create the release and attach artifacts.
      id-token: write # Required to sign artifact provenance with GitHub OIDC.
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck immutable release tag
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.provenance.outputs.tag_object }}
        shell: bash
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          remote_tag_object="$(git ls-remote --tags origin "$tag_ref" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$EXPECTED_TAG_OBJECT" || "$remote_tag_object" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} changed or disappeared after publication" >&2
            exit 1
          fi

      - name: Download crate package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate-package
          path: dist

      - name: Verify package checksum
        shell: bash
        run: |
          cd dist
          sha256sum --check ./*.crate.sha256

      - name: Attest crate provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.crate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          prerelease=false
          if [[ "$TAG_NAME" == *-* ]]; then
            prerelease=true
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "ThreatFlux Package Security ${TAG_NAME}" \
              --prerelease="$prerelease"
            gh release upload "$TAG_NAME" \
              dist/*.crate \
              dist/*.crate.sha256 \
              dist/package-contents.txt \
              --clobber

            # The shared release action lists only breaking, feat, and fix
            # commits, so a release cut from ci, docs, or chore commits gets a
            # body that is only its "## Release <tag>" heading. Keep notes
            # that say something; replace that placeholder with GitHub's
            # generated notes for the changes since the previous release.
            body="$(gh release view "$TAG_NAME" --json body --jq .body | tr -d '\r' | sed '/^[[:space:]]*$/d')"
            if [[ "$body" == "## Release ${TAG_NAME}" ]]; then
              notes="${RUNNER_TEMP}/release-notes.md"
              printf '## Release %s\n\n' "$TAG_NAME" > "$notes"
              gh api --method POST "repos/${GH_REPO}/releases/generate-notes" \
                -f tag_name="$TAG_NAME" --jq .body >> "$notes"
              gh release edit "$TAG_NAME" --notes-file "$notes"
              echo "Replaced the heading-only release notes with generated notes"
            fi
          else
            options=(--generate-notes --title "ThreatFlux Package Security ${TAG_NAME}" --verify-tag)
            if [[ "$prerelease" == "true" ]]; then
              options+=(--prerelease)
            fi
            gh release create "$TAG_NAME" \
              dist/*.crate \
              dist/*.crate.sha256 \
              dist/package-contents.txt \
              "${options[@]}"
          fi
