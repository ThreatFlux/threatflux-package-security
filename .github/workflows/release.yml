name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  provenance:
    name: Verify release provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      package_name: ${{ steps.version.outputs.package_name }}
      package_version: ${{ steps.version.outputs.package_version }}
      published: ${{ steps.registry.outputs.published }}
      published_checksum: ${{ steps.registry.outputs.published_checksum }}
      tag_object: ${{ steps.provenance.outputs.tag_object }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Verify semantic version
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag $GITHUB_REF_NAME is not a semantic version" >&2
            exit 1
          fi

          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          package_name="$(jq -er '.packages[] | select(.name == "threatflux-package-security") | .name' <<< "$metadata")"
          package_version="$(jq -er '.packages[] | select(.name == "threatflux-package-security") | .version' <<< "$metadata")"
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match ${package_name} ${package_version}" >&2
            exit 1
          fi

          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Verify annotated tag is on main
        id: provenance
        shell: bash
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} must be annotated" >&2
            exit 1
          fi

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          tag_commit="$(git rev-list -n 1 "$tag_ref")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release commit $tag_commit is not reachable from origin/main" >&2
            exit 1
          fi

          tag_object="$(git rev-parse "$tag_ref")"
          remote_tag_object="$(git ls-remote --tags origin "$tag_ref" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$remote_tag_object" || "$remote_tag_object" != "$tag_object" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} changed during provenance verification" >&2
            exit 1
          fi
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"

      - name: Inspect crates.io publication state
        id: registry
        env:
          PACKAGE_NAME: ${{ steps.version.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        shell: bash
        run: |
          response="$(mktemp)"
          status="$(curl --silent --show-error --retry 3 \
            --user-agent "ThreatFlux-package-security-release/${GITHUB_RUN_ID}" \
            --output "$response" --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/${PACKAGE_NAME}")"

          if [[ "$status" == "404" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "published_checksum=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$status" != "200" ]]; then
            echo "crates.io returned HTTP $status for ${PACKAGE_NAME}" >&2
            cat "$response" >&2
            exit 1
          fi
          if ! jq -e '.versions | type == "array"' "$response" >/dev/null; then
            echo "crates.io returned an unexpected response for ${PACKAGE_NAME}" >&2
            exit 1
          fi

          checksum="$(jq -er --arg version "$PACKAGE_VERSION" \
            '.versions[] | select(.num == $version) | .checksum' "$response" 2>/dev/null || true)"
          if [[ -n "$checksum" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "published_checksum=$checksum" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "published_checksum=" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify release (${{ matrix.os }})
    needs: provenance
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Test release build
        run: cargo test --release --all-targets --all-features --locked

  publish:
    name: Package and publish to crates.io
    needs: [provenance, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: crates-io
      url: https://crates.io/crates/threatflux-package-security
    permissions:
      contents: read
      id-token: write # Required to exchange GitHub's OIDC identity for a crates.io token.
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt

      - name: Check formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build and test API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --all-features --no-deps --locked
          cargo test --doc --all-features --locked
          make markdown

      - name: Install supply-chain tools
        # This pinned installer commit also pins tool versions and checksums.
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-audit,cargo-deny

      - name: Verify advisories and dependency policy
        run: |
          cargo audit --deny warnings
          cargo deny check

      - name: Validate crates.io publication
        env:
          PACKAGE_NAME: ${{ needs.provenance.outputs.package_name }}
        run: cargo publish --dry-run --locked --package "$PACKAGE_NAME"

      - name: Build release package
        env:
          PACKAGE_NAME: ${{ needs.provenance.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.provenance.outputs.package_version }}
        shell: bash
        run: |
          mkdir -p target
          cargo package --list --locked --package "$PACKAGE_NAME" \
            > target/package-contents.txt
          cargo package --locked --package "$PACKAGE_NAME"
          package="target/package/${PACKAGE_NAME}-${PACKAGE_VERSION}.crate"
          test -f "$package"
          local_checksum="$(sha256sum "$package" | awk '{ print $1 }')"
          echo "LOCAL_PACKAGE=$package" >> "$GITHUB_ENV"
          echo "LOCAL_CHECKSUM=$local_checksum" >> "$GITHUB_ENV"

      - name: Verify existing publication matches this tag
        if: needs.provenance.outputs.published == 'true'
        env:
          PUBLISHED_CHECKSUM: ${{ needs.provenance.outputs.published_checksum }}
        shell: bash
        run: |
          if [[ -z "$PUBLISHED_CHECKSUM" || "$LOCAL_CHECKSUM" != "$PUBLISHED_CHECKSUM" ]]; then
            echo "Published crate checksum does not match the tagged source package" >&2
            exit 1
          fi

      - name: Recheck immutable release tag
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.provenance.outputs.tag_object }}
        shell: bash
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          remote_tag_object="$(git ls-remote --tags origin "$tag_ref" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$EXPECTED_TAG_OBJECT" || "$remote_tag_object" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} changed or disappeared after verification" >&2
            exit 1
          fi

      - name: Authenticate with crates.io
        if: needs.provenance.outputs.published == 'false'
        id: crates-io
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate
        if: needs.provenance.outputs.published == 'false'
        env:
          OIDC_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
          BOOTSTRAP_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PACKAGE_NAME: ${{ needs.provenance.outputs.package_name }}
        shell: bash
        run: |
          registry_token="$OIDC_REGISTRY_TOKEN"
          if [[ -z "$registry_token" ]]; then
            registry_token="$BOOTSTRAP_REGISTRY_TOKEN"
          fi
          if [[ -z "$registry_token" ]]; then
            echo "Neither crates.io trusted publishing nor the bootstrap registry secret supplied a token" >&2
            exit 1
          fi
          CARGO_REGISTRY_TOKEN="$registry_token" \
            cargo publish --locked --package "$PACKAGE_NAME"

      - name: Download and verify the published crate
        env:
          PACKAGE_NAME: ${{ needs.provenance.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.provenance.outputs.package_version }}
        shell: bash
        run: |
          mkdir release-artifacts
          destination="release-artifacts/${PACKAGE_NAME}-${PACKAGE_VERSION}.crate"

          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location \
              --user-agent "ThreatFlux-package-security-release/${GITHUB_RUN_ID}" \
              "https://crates.io/api/v1/crates/${PACKAGE_NAME}/${PACKAGE_VERSION}/download" \
              --output "$destination"; then
              break
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "Published crate was not downloadable after 12 attempts" >&2
              exit 1
            fi
            sleep 10
          done

          downloaded_checksum="$(sha256sum "$destination" | awk '{ print $1 }')"
          if [[ "$downloaded_checksum" != "$LOCAL_CHECKSUM" ]]; then
            echo "Downloaded crate does not match the package uploaded by Cargo" >&2
            exit 1
          fi

          cp target/package-contents.txt release-artifacts/
          cd release-artifacts
          sha256sum "${PACKAGE_NAME}-${PACKAGE_VERSION}.crate" \
            > "${PACKAGE_NAME}-${PACKAGE_VERSION}.crate.sha256"

      - name: Upload published package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate-package
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Create GitHub release
    needs: [provenance, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write # Required to persist GitHub artifact attestations.
      contents: write # Required only to create the release and attach artifacts.
      id-token: write # Required to sign artifact provenance with GitHub OIDC.
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck immutable release tag
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.provenance.outputs.tag_object }}
        shell: bash
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          remote_tag_object="$(git ls-remote --tags origin "$tag_ref" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$EXPECTED_TAG_OBJECT" || "$remote_tag_object" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} changed or disappeared after publication" >&2
            exit 1
          fi

      - name: Download crate package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate-package
          path: dist

      - name: Verify package checksum
        shell: bash
        run: |
          cd dist
          sha256sum --check ./*.crate.sha256

      - name: Attest crate provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.crate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          prerelease=false
          if [[ "$TAG_NAME" == *-* ]]; then
            prerelease=true
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "ThreatFlux Package Security ${TAG_NAME}" \
              --prerelease="$prerelease"
            gh release upload "$TAG_NAME" \
              dist/*.crate \
              dist/*.crate.sha256 \
              dist/package-contents.txt \
              --clobber
          else
            options=(--generate-notes --title "ThreatFlux Package Security ${TAG_NAME}" --verify-tag)
            if [[ "$prerelease" == "true" ]]; then
              options+=(--prerelease)
            fi
            gh release create "$TAG_NAME" \
              dist/*.crate \
              dist/*.crate.sha256 \
              dist/package-contents.txt \
              "${options[@]}"
          fi
