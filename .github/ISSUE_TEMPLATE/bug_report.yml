name: Bug report
description: Report reproducible incorrect or unexpected behavior
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include private packages, credentials, live malware, or undisclosed vulnerabilities. Report security issues through the private channel in SECURITY.md.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I can reproduce this on a supported version or current `main`.
          required: true
        - label: This report does not contain sensitive security information.
          required: true

  - type: input
    id: version
    attributes:
      label: Crate version or commit
      placeholder: "Full commit SHA or published version"
    validations:
      required: true

  - type: dropdown
    id: ecosystem
    attributes:
      label: Input ecosystem
      options:
        - npm directory
        - Python directory
        - Java archive
        - Custom pattern or database
        - Not input-specific
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic input and include the smallest code sample that reproduces the problem.
      render: rust
    validations:
      required: true

  - type: textarea
    id: input_shape
    attributes:
      label: Input shape
      description: Describe relevant file names, approximate byte sizes, archive entry counts, and metadata without attaching sensitive artifacts.
      placeholder: "package.json: 2 KiB; 4 direct dependencies; no symlinks"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the complete bounded error or finding output. Remove secrets and private paths.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: Ubuntu 24.04
        rustc: 1.x.y
        dependency source: git <full SHA> or crates.io <version>
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Note regressions, workarounds, or related issues.
