name: Feature request
description: Propose a focused capability or behavior change
title: "proposal: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the security-analysis use case, not only a preferred implementation. Large API, parser, scoring, advisory-data, or network changes should begin here.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: This can be discussed publicly and contains no sensitive vulnerability details.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected, what workflow is blocked, and why existing behavior is insufficient?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Define observable inputs, outputs, errors, and compatibility expectations.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - npm analysis
        - Python analysis
        - Java archive analysis
        - Vulnerability data and version matching
        - Patterns and name similarity
        - Risk model and result types
        - Performance and resource limits
        - Documentation and developer experience
        - CI, security, or releases
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security and resource considerations
      description: Address untrusted input, network/cache behavior, execution boundaries, worst-case work, and false positives/negatives.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include application-level workarounds or narrower designs.

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Note public API, serialized data, pattern identifiers, scoring, and MSRV effects.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Link public specifications or small synthetic examples.
